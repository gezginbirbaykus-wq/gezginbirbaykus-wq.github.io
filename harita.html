<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gezi Haritam — Gezginbirbaykus</title>
  <meta name="description" content="Gezginbirbaykus Türkiye ilçe gezi haritası." />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>" />
  <style>
    .harita-page { background: var(--bg); min-height: 100vh; }

    .harita-stats {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 32px 0;
    }
    .stats-baslik {
      font-family: 'Sanchez', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--brown);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stats-baslik::after { content:''; flex:1; height:1px; background:linear-gradient(to right, var(--border), transparent); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-kart { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:12px; }
    .stat-renk { width:13px; height:13px; border-radius:50%; flex-shrink:0; border:2px solid rgba(0,0,0,0.1); }
    .stat-renk.gezildi   { background:#27ae60; }
    .stat-renk.kismen    { background:#2980b9; }
    .stat-renk.gecildi   { background:#f39c12; }
    .stat-renk.gezilmedi { background:#ecf0f1; border-color:#bdc3c7; }
    .stat-sayi  { font-size:1.4rem; font-weight:700; color:var(--brown); line-height:1; margin-bottom:2px; }
    .stat-etiket{ font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }

    .progress-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:20px; }
    .progress-label { display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.84rem; color:var(--text-muted); }
    .progress-label strong { color:var(--brown); }
    .progress-bar-bg { height:9px; background:var(--border-light); border-radius:10px; overflow:hidden; display:flex; }
    .progress-bar-fill { height:100%; transition:width 1s ease; }
    .progress-bar-fill.gezildi { background:#27ae60; }
    .progress-bar-fill.kismen  { background:#2980b9; }
    .progress-bar-fill.gecildi { background:#f39c12; }

    .legend { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
    .legend-item { display:flex; align-items:center; gap:7px; font-size:0.8rem; color:var(--text-muted); }
    .legend-renk { width:16px; height:10px; border-radius:3px; border:1px solid rgba(0,0,0,0.1); flex-shrink:0; }
    .legend-renk.gezildi   { background:#27ae60; }
    .legend-renk.kismen    { background:#2980b9; }
    .legend-renk.gecildi   { background:#f39c12; }
    .legend-renk.gezilmedi { background:#f5f0eb; }

    /* SVG HARİTA — sehir ve ilce stilleri */
    .svg-harita-wrap svg,
    .svg-harita-mini-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Tüm path'ler için default */
    .svg-harita-wrap svg path,
    .svg-harita-mini-wrap svg path {
      fill: #f0ece6;
      stroke: #d4c4b8;
      stroke-width: 0.3px;
      transition: fill 0.12s, opacity 0.12s;
    }

    /* İl sınırları — kalın */
    .svg-harita-wrap svg .sehir > path,
    .svg-harita-mini-wrap svg .sehir > path {
      stroke: #8a6a50 !important;
      stroke-width: 1.2px !important;
    }

    /* İlçe renkleri */
    .svg-harita-wrap svg .ilce > path,
    .svg-harita-mini-wrap svg .ilce > path {
      fill: #f0ece6;
      stroke: #c4b5a8;
      stroke-width: 0.35px;
      cursor: default;
    }

    .svg-harita-wrap svg .ilce.gezildi > path,
    .svg-harita-mini-wrap svg .ilce.gezildi > path {
      fill: #27ae60 !important;
      stroke: #1e8449 !important;
      stroke-width: 0.5px;
      cursor: pointer;
    }

    .svg-harita-wrap svg .ilce.kismen > path,
    .svg-harita-mini-wrap svg .ilce.kismen > path {
      fill: #2980b9 !important;
      stroke: #1f618d !important;
      stroke-width: 0.5px;
    }

    .svg-harita-wrap svg .ilce.gecildi > path,
    .svg-harita-mini-wrap svg .ilce.gecildi > path {
      fill: #f39c12 !important;
      stroke: #d68910 !important;
      stroke-width: 0.5px;
    }

    .svg-harita-wrap svg .ilce.gezilmedi > path,
    .svg-harita-mini-wrap svg .ilce.gezilmedi > path {
      fill: #f0ece6 !important;
      stroke: #c4b5a8 !important;
    }

    .svg-harita-wrap svg .ilce:hover > path,
    .svg-harita-mini-wrap svg .ilce:hover > path {
      opacity: 0.7;
    }

    /* Tooltip */
    #harita-tooltip {
      position: fixed;
      background: rgba(255,255,255,0.97);
      border: 1px solid #DEB898;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: #2A1F16;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      pointer-events: none;
      z-index: 9999;
      display: none;
      white-space: nowrap;
      max-width: 220px;
    }

    [data-theme="dark"] #harita-tooltip {
      background: rgba(44,32,24,0.97);
      color: #F0E6DA;
      border-color: #4A3020;
    }

    #harita-tooltip .tt-durum {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    #harita-tooltip .tt-il {
      display: block;
      font-size: 0.72rem;
      color: #9B6240;
      font-weight: 400;
      margin-top: 2px;
    }
    #harita-tooltip .tt-link-hint {
      display: block;
      font-size: 0.7rem;
      color: #27ae60;
      font-weight: 500;
      margin-top: 3px;
    }

    /* Yükleniyor */
    .harita-yukle {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 300px; gap: 16px; color: var(--brown-60);
    }

    @media (max-width: 768px) {
      .harita-stats, .harita-kapsayici { padding-left: 16px; padding-right: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body class="harita-page">

    <div class="header-inner">
      <a href="./index.html" class="logo-area">
        <img src="./assets/logo.png" alt="Logo" onerror="this.style.display='none'" />
        <span class="logo-text">Gezginbirbaykus</span>

  <section class="harita-stats">

    <div class="stats-grid">
      <div class="stat-kart"><div class="stat-renk gezildi"></div><div><div class="stat-sayi" id="sayi-gezildi">—</div><div class="stat-etiket">Gezildi</div></div></div>
      <div class="stat-kart"><div class="stat-renk kismen"></div><div><div class="stat-sayi" id="sayi-kismen">—</div><div class="stat-etiket">Kısmen</div></div></div>
      <div class="stat-kart"><div class="stat-renk gecildi"></div><div><div class="stat-sayi" id="sayi-gecildi">—</div><div class="stat-etiket">Yoldan Geçildi</div></div></div>
      <div class="stat-kart"><div class="stat-renk gezilmedi"></div><div><div class="stat-sayi">973</div><div class="stat-etiket">Toplam İlçe</div></div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Türkiye ilçelerini <strong id="progress-yuzde">0%</strong> oranında gezdim</span>
        <span id="progress-metin" style="color:var(--text-faint);font-size:0.76rem;"></span>

      <div class="progress-bar-bg">

        <div class="progress-bar-fill gecildi" id="bar-gecildi" style="width:0%"></div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-renk gezildi"></div> Gezildi — tıkla içeriğe git</div>
      <div class="legend-item"><div class="legend-renk kismen"></div> Kısmen Gezildi</div>
      <div class="legend-item"><div class="legend-renk gecildi"></div> Yoldan Geçildi</div>
      <div class="legend-item"><div class="legend-renk gezilmedi"></div> Gezilmedi</div>
    </div>
  </section>

  <section class="harita-kapsayici">
    <div id="harita-yukle" class="harita-yukle">
      <div class="spinner"></div>

    </div>
    <div class="svg-harita-wrap" id="svg-wrap" style="display:none;">
      <!-- SVG buraya yüklenecek -->
    </div>
  </section>

  <!-- Tooltip -->
  <div id="harita-tooltip"></div>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // Gece modu
    const toggle = document.getElementById('theme-toggle');
    const saved  = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    toggle.addEventListener('click', () => {
      const cur  = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    const RENKLER_HEX = {
      gezildi:   '#27ae60',
      kismen:    '#2980b9',
      gecildi:   '#f39c12',
      gezilmedi: '#bdc3c7',
    };

    const TOPLAM = 973;

    async function yukle() {
      try {
        const [ilceSnap, ilSnap, eslesmeSnap, svgResp] = await Promise.all([
          getDocs(collection(db, 'ilceler')),
          getDocs(collection(db, 'iller')),
          getDocs(collection(db, 'haritaEslesme')),
          fetch('./assets/turkiye-ilceler.svg'),
        ]);

        const illerMap = {};
        ilSnap.docs.forEach(d => { illerMap[d.id] = d.data().ad; });

        const ilcelerByNorm = {}, ilcelerById = {};
        ilceSnap.docs.forEach(d => {
          const data = d.data();
          const obj  = { id: d.id, ad: data.ad, durum: data.durum || 'gezilmedi', il: illerMap[data.ilId] || '' };
          ilcelerByNorm[norm(data.ad)] = obj;
          ilcelerById[d.id] = obj;
        });

        // Manuel eşleştirme (haritaEslesme koleksiyonu)
        const eslesme = {}; // svgId → ilceId
        eslesmeSnap.docs.forEach(d => {
          const data = d.data();
          if (data.svgId && data.ilceId) eslesme[data.svgId] = data.ilceId;
          // Eski format desteği (topoAd)
          if (data.topoAd && data.ilceId) eslesme[norm(data.topoAd)] = data.ilceId;
        });

        // İstatistikler
        let g = 0, k = 0, gc = 0;
        Object.values(ilcelerByNorm).forEach(i => {
          if      (i.durum === 'gezildi')  g++;
          else if (i.durum === 'kismen')   k++;
          else if (i.durum === 'gecildi')  gc++;
        });
        document.getElementById('sayi-gezildi').textContent = g;
        document.getElementById('sayi-kismen').textContent  = k;
        document.getElementById('sayi-gecildi').textContent = gc;
        const oran = ((g + k * 0.5 + gc * 0.25) / TOPLAM * 100);
        document.getElementById('progress-yuzde').textContent = oran.toFixed(1) + '%';
        document.getElementById('progress-metin').textContent = `${g} tam · ${k} kısmi · ${gc} geçiş`;
        document.getElementById('bar-gezildi').style.width = (g  / TOPLAM * 100).toFixed(2) + '%';
        document.getElementById('bar-kismen').style.width  = (k  / TOPLAM * 100).toFixed(2) + '%';
        document.getElementById('bar-gecildi').style.width = (gc / TOPLAM * 100).toFixed(2) + '%';

        // SVG yükle
        const svgText = await svgResp.text();
        const wrap = document.getElementById('svg-wrap');
        wrap.innerHTML = svgText;
        document.getElementById('harita-yukle').style.display = 'none';
        wrap.style.display = '';

        const svg = wrap.querySelector('svg');

        // SVG içindeki varsayılan stili temizle (bizimkiler geçerli olsun)
        const svgStyle = svg.querySelector('style');
        if (svgStyle) svgStyle.remove();
        let viewBox = { x: 0, y: 0, w: 800, h: 264 };
        const origW = 800, origH = 264;
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        svg.style.cursor = 'grab';

        // Zoom butonları
        const zoomWrap = document.createElement('div');
        zoomWrap.style.cssText = 'position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:10;';
        zoomWrap.innerHTML = `
          <button id="z-in"  style="width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--brown);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);">+</button>
          <button id="z-out" style="width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--brown);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);">−</button>
          <button id="z-reset" style="width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--brown);font-size:0.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.1);font-weight:700;">⌂</button>`;
        wrap.style.position = 'relative';
        wrap.appendChild(zoomWrap);

        function setView(x, y, w, h) {
          viewBox = { x, y, w, h };
          svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
        }

        function zoom(factor, cx, cy) {
          cx = cx ?? viewBox.x + viewBox.w / 2;
          cy = cy ?? viewBox.y + viewBox.h / 2;
          const nw = Math.max(100, Math.min(origW, viewBox.w * factor));
          const nh = nw * (origH / origW);
          const nx = cx - (cx - viewBox.x) * (nw / viewBox.w);
          const ny = cy - (cy - viewBox.y) * (nh / viewBox.h);
          setView(nx, ny, nw, nh);
        }

        document.getElementById('z-in').onclick    = () => zoom(0.65);
        document.getElementById('z-out').onclick   = () => zoom(1.5);
        document.getElementById('z-reset').onclick = () => setView(0, 0, origW, origH);

        // Mouse wheel zoom
        svg.addEventListener('wheel', e => {
          e.preventDefault();
          const rect   = svg.getBoundingClientRect();
          const cx = viewBox.x + (e.clientX - rect.left) / rect.width  * viewBox.w;
          const cy = viewBox.y + (e.clientY - rect.top)  / rect.height * viewBox.h;
          zoom(e.deltaY > 0 ? 1.2 : 0.8, cx, cy);
        }, { passive: false });

        // Pan
        let dragging = false, lastX = 0, lastY = 0;
        svg.addEventListener('mousedown', e => {
          dragging = true; lastX = e.clientX; lastY = e.clientY;
          svg.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', e => {
          if (!dragging) return;
          const rect = svg.getBoundingClientRect();
          const dx = -(e.clientX - lastX) / rect.width  * viewBox.w;
          const dy = -(e.clientY - lastY) / rect.height * viewBox.h;
          lastX = e.clientX; lastY = e.clientY;
          setView(viewBox.x + dx, viewBox.y + dy, viewBox.w, viewBox.h);
        });
        window.addEventListener('mouseup', () => { dragging = false; svg.style.cursor = 'grab'; });

        // Touch pan
        let lastTouch = null;
        svg.addEventListener('touchstart', e => { if (e.touches.length === 1) lastTouch = e.touches[0]; });
        svg.addEventListener('touchmove', e => {
          e.preventDefault();
          if (e.touches.length === 1 && lastTouch) {
            const rect = svg.getBoundingClientRect();
            const dx = -(e.touches[0].clientX - lastTouch.clientX) / rect.width  * viewBox.w;
            const dy = -(e.touches[0].clientY - lastTouch.clientY) / rect.height * viewBox.h;
            lastTouch = e.touches[0];
            setView(viewBox.x + dx, viewBox.y + dy, viewBox.w, viewBox.h);
          }
        }, { passive: false });

        // Her ilçeye renk ve event ekle
        svg.querySelectorAll('g.ilce').forEach(ilceEl => {
          const svgId   = ilceEl.id; // örn: "adana-aladag"
          const titleEl = ilceEl.querySelector('title');
          const titleAd = titleEl ? titleEl.textContent.trim() : '';

          // Firestore eşleştirmesi bul
          let veri = null;
          if (eslesme[svgId] && ilcelerById[eslesme[svgId]]) {
            veri = ilcelerById[eslesme[svgId]];
          } else {
            // İlçe adından normalize eşleştir
            veri = ilcelerByNorm[norm(titleAd)];
            // id'nin son kısmından da dene (ör: adana-aladag → aladag)
            if (!veri) {
              const parcalar = svgId.split('-');
              const ilceKismi = parcalar.slice(1).join('-');
              veri = ilcelerByNorm[norm(ilceKismi)];
            }
          }

          const durum = veri ? veri.durum : 'gezilmedi';
          ilceEl.classList.remove('gezildi','kismen','gecildi','gezilmedi');
          ilceEl.classList.add(durum);

          // İl adı — SVG'de sehir id'sinden al
          const sehirEl = ilceEl.closest('g.sehir');
          const ilAd    = sehirEl ? sehirEl.id.replace(/-/g, ' ') : '';
          const gosterAd = veri ? veri.ad : titleAd;

          // Tooltip
          const tooltip = document.getElementById('harita-tooltip');

          ilceEl.addEventListener('mouseenter', e => {
            tooltip.innerHTML = `
              <span class="tt-durum" style="background:${RENKLER_HEX[durum]};"></span>${gosterAd}
              <span class="tt-il">${veri ? veri.il || ilAd : ilAd}</span>
              ${durum === 'gezildi' ? '<span class="tt-link-hint">→ içeriği gör</span>' : ''}
            `;
            tooltip.style.display = 'block';
          });

          ilceEl.addEventListener('mousemove', e => {
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top  = (e.clientY - 10) + 'px';
          });

          ilceEl.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
          });

          // Tıklama — gezildi ise ilçe sayfasına git, diğerleri tooltip'te zaten bilgi var
          ilceEl.addEventListener('click', (e) => {
            if (dragging) return; // pan sırasında tıklama sayılmasın
            if (durum === 'gezildi' && veri) {
              window.location.href = `./ilce.html?id=${veri.id}`;
            }
          });
        });

      } catch (err) {
        console.error(err);
        document.getElementById('harita-yukle').innerHTML = `
          <div class="empty-state">
            <div class="owl-icon">🦉</div>
            <p>Harita yüklenemedi: ${err.message}</p>
          </div>`;
      }
    }

    function norm(ad) {
      return (ad || '').toLowerCase()
        .replace(/\s*\(.*?\)\s*/g, '')
        .replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ş/g,'s')
        .replace(/ç/g,'c').replace(/ö/g,'o').replace(/ü/g,'u')
        .trim();
    }

    yukle();
  </script>
</body>
